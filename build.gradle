plugins {
  id ‘citsource.common-conventions’
  id ‘citsource.python-conventions’
  id ‘citadel-batch-plugin’
}

description = “Oracle Fusion FA Cross-Book Transfer (CDX Batch runner)”

conda {
  realPackages = [
    “requests”,
    “pydantic”,
    “typer”,
    “python-dateutil”,
    “google”,
    “google-auth”,
    “google-auth-oauthlib”,
    “google-api-core”,
    “google-cloud-core”,
    “google-cloud-storage”,
    “pandas”
  ]

  condaEnvironment(“faBookXferEnv”) {
    realmCondaBuild = CITSOURCE_REALM3_CONDA_BUILD
  }
}

cigpy {
  useCondaEnvironment(“:oraclefusion:assetxferpipeline”, “faBookXferEnv”)
}

cigdocker {
  createDockerImage = true
}

sourceSets {
  main {
    python {
      includes += [
        “**/*.py”,
        “**/*.json”,
        “**/*.yaml”,
        “**/*.yml”,
        “**/*.txt”
      ]
    }
  }
}

startScripts {
  pythonBinary(“fa_book_xfer”) {
    main = “batch_entrypoint.py”
  }
}

deployments {
  deployment(“fa-asset-xfer”) {
    team = “pte-accounting-engineering”
    project = “assetxferpipeline”
    appCatalogApplication = “FA Asset Transfer”

    tag “build-tag”

    gke(“botora fa-asset-xfer”) {
      configDir = “k8s/fa-asset-xfer/botora”
      namespace = “accounting-gateway”
      project = “cig-acctgateway-dev-1”
      cluster = “ent-acctgateway-1--dev--us-east1”
      credentialsSecret = “service-accounts/fa-asset-xfer/dev”
      region = “us-east1”
    }

    gke(“prod fa-asset-xfer”) {
      configDir = “k8s/fa-asset-xfer/prod”
      namespace = “accounting-gateway”
      project = “cig-acctgateway-prod-1”
      cluster = “ent-acctgateway-1--prod--us-east1”
      region = “us-east1”
      soc1 = true
    }

    gke(“dr fa-asset-xfer”) {
      configDir = “k8s/fa-asset-xfer/prod”
      namespace = “accounting-gateway”
      project = “cig-acctgateway-prod-1”
      cluster = “ent-acctgateway-1--prod--us-central1”
      region = “us-central1”
      soc1 = true
    }
  }

  deployment(“fa-asset-xfer-batch”) {
    team = “OracleFusion”
    project = “assetxferpipeline”

    batch(“fa-asset-xfer-batch”) {
      username = “sd_orc_fdi”
    }
  }
}