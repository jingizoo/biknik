name: Hockey Scheduler Backend CI

concurrency:
  group: hockey-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "hockey-scheduler/backend/**"
      - "hockey-scheduler/docs/**"
      - "hockey-scheduler/e2e/**"
      - ".github/workflows/hockey-scheduler-ci.yml"
  push:
    branches:
      - main
    paths:
      - "hockey-scheduler/backend/**"
      - "hockey-scheduler/docs/**"
      - "hockey-scheduler/e2e/**"
      - ".github/workflows/hockey-scheduler-ci.yml"

jobs:
  # Change-based routing (requested optimization): a docs-only PR should not
  # spin up two full test suites and four browser runners; a frontend-only PR
  # should not re-run PostgreSQL, and a backend-only PR should not reinstall
  # Chromium. This job diffs the PR against its base with plain git (no
  # third-party action — the rest of this workflow uses only official actions)
  # and emits booleans the heavy jobs gate on. On push to main we run
  # everything, since there is no cheap base to diff and main is the gate of
  # record.
  #
  # Routing (matches the requested table):
  #   docs-only          -> nothing heavy (this job only)
  #   frontend / e2e      -> frontend-check + browser-smoke
  #   backend (any .py)   -> test (memory+SQLite) + postgres
  #   migrations/concurrency is a subset of "backend" -> both DB backends,
  #                          i.e. the full DB matrix, automatically.
  # The workflow file changing forces the whole thing to run (fail-safe).
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # On push to main we cannot rely on a cheap base diff, and main is
          # the gate of record — run every downstream job.
          if [ "$EVENT" != "pull_request" ]; then
            echo "run everything (event=$EVENT)"
            echo "backend=true"  >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "e2e=true"      >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA" || git fetch --no-tags origin "$BASE_SHA"
          FILES="$(git diff --name-only "$BASE_SHA" HEAD)"
          echo "Changed files:"; echo "$FILES"

          # A workflow-file change is a fail-safe: run everything.
          if echo "$FILES" | grep -qxF '.github/workflows/hockey-scheduler-ci.yml'; then
            echo "workflow changed -> run everything"
            echo "backend=true"  >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "e2e=true"      >> "$GITHUB_OUTPUT"
            exit 0
          fi

          match() { echo "$FILES" | grep -qE "$1"; }

          # Backend = any Python under the package or its tests. The static
          # front-end assets live under web/static and are handled separately,
          # so a pure JS/CSS/HTML edit does NOT count as a backend change.
          if match '^hockey-scheduler/backend/.*\.py$'; then
            echo "backend=true"  >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

          # Front-end = the served static assets (JS/CSS/HTML) the browser runs.
          if match '^hockey-scheduler/backend/hockey_scheduler/web/static/'; then
            echo "frontend=true"  >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

          # e2e = the Playwright journeys / node-check scripts themselves.
          if match '^hockey-scheduler/e2e/'; then
            echo "e2e=true"  >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hockey-scheduler/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests (in-memory + SQLite)
        run: python -m unittest discover -s tests -v

  postgres:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hockey-scheduler/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hockey
          POSTGRES_PASSWORD: hockey
          POSTGRES_DB: hockey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hockey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Postgres driver
        run: pip install "psycopg[binary]>=3.1"
      - name: Run full suite against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://hockey:hockey@localhost:5432/hockey
        run: python -m unittest discover -s tests -v

  frontend-check:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check browser scripts
        run: |
          node --check hockey-scheduler/backend/hockey_scheduler/web/static/app.js
          node --check hockey-scheduler/backend/hockey_scheduler/web/static/setup.js
          node --check hockey-scheduler/backend/hockey_scheduler/web/static/onboarding.js
          node --check hockey-scheduler/backend/hockey_scheduler/web/static/onboarding-bootstrap.js
          node --check hockey-scheduler/backend/hockey_scheduler/web/static/hierarchy-import.js
          node --check hockey-scheduler/e2e/setup-claim.js
          node --check hockey-scheduler/e2e/onboarding-wizard.js
          node --check hockey-scheduler/e2e/hierarchy-import.js
          node --check hockey-scheduler/e2e/season-participation.js
          node --check hockey-scheduler/e2e/season-rollover.js
          node --check hockey-scheduler/e2e/team-division-participation.js
          node --check hockey-scheduler/e2e/permanent-teams.js
          node --check hockey-scheduler/e2e/safe-destructive.js
          node --check hockey-scheduler/e2e/destructive-surfaces.js
          node --check hockey-scheduler/e2e/reset-visibility.js
          node --check hockey-scheduler/e2e/factory-reset.js
          node --check hockey-scheduler/e2e/demo-lifecycle.js
          node --check hockey-scheduler/e2e/api-error-resilience.js
          node --check hockey-scheduler/e2e/v1-dependency-proof.js
          node --check hockey-scheduler/e2e/check-v1-route-contract.js
          node --check hockey-scheduler/e2e/team-club-optional.js
          node --check hockey-scheduler/e2e/division-delete-cleanup.js
          node --check hockey-scheduler/e2e/registration-cleanup.js
          node --check hockey-scheduler/e2e/venue-sharing.js
          node --check hockey-scheduler/e2e/records-delete.js
          node --check hockey-scheduler/e2e/coach-scope.js
          node --check hockey-scheduler/e2e/context-switcher.js
          node --check hockey-scheduler/e2e/player-edit.js
          node --check hockey-scheduler/e2e/player-lifecycle.js
          node --check hockey-scheduler/e2e/season-dates.js
          node --check hockey-scheduler/e2e/season-fmt-unit.js
      - name: Check v1 route contract (#233 B2c)
        run: node hockey-scheduler/e2e/check-v1-route-contract.js
      - name: Season date formatter unit regression (#272)
        run: node hockey-scheduler/e2e/season-fmt-unit.js

  browser-smoke:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hockey-scheduler/e2e
    strategy:
      fail-fast: false
      matrix:
        # Four isolated runners (#260 Slice F): each shard runs its own
        # journeys sequentially via one runner/server-per-journey lifecycle,
        # same as before — only the grouping into parallel jobs is new.
        # Journey pairs that hardcode the SAME desktop/phone ports
        # (season-rollover/permanent-teams: 8143/8144, demo-lifecycle/
        # team-club-optional: 8181/8182, allowed-venues/division-delete-
        # cleanup: 8191/8192) are deliberately split across different
        # shards so they never risk running concurrently on the same
        # runner.
        include:
          - shard: 1
            scripts: "smoke setup-claim onboarding-wizard hierarchy-import season-participation season-rollover season-dates"
          - shard: 2
            scripts: "team-division-participation allowed-venues venue-access-cleanup venue-sharing permanent-teams player-edit"
          - shard: 3
            scripts: "safe-destructive destructive-surfaces reset-visibility factory-reset demo-lifecycle api-error-resilience context-switcher"
          - shard: 4
            scripts: "v1-dependency-proof team-club-optional division-delete-cleanup registration-cleanup records-delete coach-scope player-lifecycle"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Cache the Playwright browser bundle (~130 MB Chromium) keyed on the
      # pinned playwright version, so the four shards — and every later run on
      # the same version — restore it instead of each downloading Chromium from
      # scratch. The OS-level shared-library deps are cheap and are (re)applied
      # every run via `install-deps`, which is a no-op when already present.
      - name: Resolve Playwright version
        id: pw
        working-directory: hockey-scheduler/e2e
        run: |
          set -euo pipefail
          # Read the pinned version from the committed lockfile — node_modules
          # does not exist yet (npm ci runs after we restore the cache).
          VERSION="$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Playwright $VERSION"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install e2e dependencies
        run: npm ci
      - name: Install Chromium (cache miss only)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium OS deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run shard ${{ matrix.shard }} journeys
        run: |
          set -e
          for script in ${{ matrix.scripts }}; do
            echo "::group::npm run $script"
            npm run "$script"
            echo "::endgroup::"
          done
