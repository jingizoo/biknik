name: Hockey Scheduler Backend CI

on:
  pull_request:
    paths:
      - "hockey-scheduler/backend/**"
      - "hockey-scheduler/docs/**"
      - "hockey-scheduler/e2e/**"
      - "hockey-scheduler/tools/**"
      - ".github/workflows/hockey-scheduler-ci.yml"
  push:
    branches:
      - main
    paths:
      - "hockey-scheduler/backend/**"
      - "hockey-scheduler/docs/**"
      - "hockey-scheduler/e2e/**"
      - "hockey-scheduler/tools/**"
      - ".github/workflows/hockey-scheduler-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hockey-scheduler/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests (in-memory + SQLite)
        run: python -m unittest discover -s tests -v

  postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hockey-scheduler/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hockey
          POSTGRES_PASSWORD: hockey
          POSTGRES_DB: hockey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hockey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Postgres driver
        run: pip install "psycopg[binary]>=3.1"
      - name: Run full suite against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://hockey:hockey@localhost:5432/hockey
        run: python -m unittest discover -s tests -v

  frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check app.js and setup.js
        run: |
          node --check hockey-scheduler/backend/hockey_scheduler/web/static/app.js
          node --check hockey-scheduler/backend/hockey_scheduler/web/static/setup.js

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright (#138)
        working-directory: hockey-scheduler/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run browser smoke test (#138)
        working-directory: hockey-scheduler/e2e
        run: npm run smoke

  source-wiring:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply one-time PR B wiring
        run: |
          if grep -q "class InstallationState" hockey-scheduler/backend/hockey_scheduler/domain/setup_models.py; then
            echo "PR B wiring already applied"
            exit 0
          fi
          python hockey-scheduler/tools/apply_pr174b.py
      - name: Commit wired sources when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hockey-scheduler
          git commit -m "Wire atomic production installation claim (#174 PR B)"
          git push origin HEAD:${{ github.head_ref }}
