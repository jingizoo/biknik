name: Hockey Scheduler Backend CI

concurrency:
  group: hockey-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# NO event-level `paths:` filter — that was fail-open: an unrecognized path
# (Makefile, scripts/, a new root file, another .github/** file) never started
# the workflow, so the fail-closed classifier could not turn it into a full
# matrix. Every PR / main push now reaches the cheap classifier, which is the
# sole gate; it skips only paths it positively recognizes as the sibling root
# project (this is a monorepo) and fails closed on everything else.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # The classifier is CI-critical, so it is validated on EVERY run (cheap,
  # node-only) — a broken router must never silently skip a heavy gate.
  classifier-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Classifier syntax + unit + integration tests
        run: |
          node --check hockey-scheduler/e2e/ci-classify.js
          node --check hockey-scheduler/e2e/ci-classify.test.js
          node --check hockey-scheduler/e2e/ci-classify.integration.test.js
          node hockey-scheduler/e2e/ci-classify.test.js
          node hockey-scheduler/e2e/ci-classify.integration.test.js

  # Change-based routing, FAIL-CLOSED. Diffs the PR against its base with plain
  # git (no third-party action) and pipes the file list through the tested
  # classifier (hockey-scheduler/e2e/ci-classify.js), which fails closed:
  # unknown / dependency / workflow paths and non-PR events run the full matrix,
  # and backend API-contract changes also run the browser gate. Downstream jobs
  # gate on these outputs.
  changes:
    needs: classifier-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      test: ${{ steps.classify.outputs.test }}
      postgres: ${{ steps.classify.outputs.postgres }}
      frontend_check: ${{ steps.classify.outputs.frontend_check }}
      browser_smoke: ${{ steps.classify.outputs.browser_smoke }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Classify changed paths (fail-closed)
        id: classify
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          FILES=""
          if [ "$CI_EVENT_NAME" = "pull_request" ]; then
            # Make sure the base tip is present, then diff with:
            #   * three-dot (BASE...HEAD) — a MERGE-BASE diff, so changes the base
            #     branch advanced with after the fork don't pollute the set;
            #   * --no-renames — so BOTH sides of a rename surface; a move OUT of a
            #     backend/API path must still classify as that change, not vanish
            #     into its (possibly docs) destination.
            # If the diff can't be computed we emit a sentinel that classifies as
            # unknown -> full matrix (fail closed), never an empty skip.
            git fetch --no-tags origin "$BASE_SHA" || true
            FILES="$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA")" || FILES="__DIFF_ERROR__"
          fi
          printf '%s\n' "$FILES" | node hockey-scheduler/e2e/ci-classify.js

  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hockey-scheduler/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The checked-in runner discovers the same complete test_*.py module
      # inventory, but executes two isolated interpreter shards concurrently.
      # Isolation preserves the suite's module-global server state.
      - name: Run unit tests (in-memory + SQLite, 2 workers)
        run: python tests/run_parallel.py -j 2

  postgres:
    needs: changes
    if: needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hockey-scheduler/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hockey
          POSTGRES_PASSWORD: hockey
          POSTGRES_DB: hockey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hockey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Postgres driver
        run: pip install "psycopg[binary]>=3.1"
      # Each worker receives its own database, so the complete PostgreSQL suite
      # can run concurrently without sharing tables or transaction state.
      - name: Run full suite against PostgreSQL (2 isolated databases)
        env:
          TEST_DATABASE_URL: postgresql://hockey:hockey@localhost:5432/hockey
        run: python tests/run_parallel.py -j 2 --postgres "$TEST_DATABASE_URL"

  frontend-check:
    needs: changes
    if: needs.changes.outputs.frontend_check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check browser scripts
        run: |
          node --check hockey-scheduler/backend/hockey_scheduler/web/static/app.js
          node --check hockey-scheduler/backend/hockey_scheduler/web/static/setup.js
          node --check hockey-scheduler/backend/hockey_scheduler/web/static/onboarding.js
          node --check hockey-scheduler/backend/hockey_scheduler/web/static/onboarding-bootstrap.js
          node --check hockey-scheduler/backend/hockey_scheduler/web/static/hierarchy-import.js
          node --check hockey-scheduler/e2e/ci-classify.js
          node --check hockey-scheduler/e2e/ci-classify.test.js
          node --check hockey-scheduler/e2e/ci-classify.integration.test.js
          node --check hockey-scheduler/e2e/setup-claim.js
          node --check hockey-scheduler/e2e/onboarding-wizard.js
          node --check hockey-scheduler/e2e/hierarchy-import.js
          node --check hockey-scheduler/e2e/season-participation.js
          node --check hockey-scheduler/e2e/hierarchy-duplicate-registration.js
          node --check hockey-scheduler/e2e/season-rollover.js
          node --check hockey-scheduler/e2e/team-division-participation.js
          node --check hockey-scheduler/e2e/scheduler-empty-state.js
          node --check hockey-scheduler/e2e/scheduler-already-scheduled.js
          node --check hockey-scheduler/e2e/ice-availability-builder.js
          node --check hockey-scheduler/e2e/permanent-teams.js
          node --check hockey-scheduler/e2e/safe-destructive.js
          node --check hockey-scheduler/e2e/destructive-surfaces.js
          node --check hockey-scheduler/e2e/reset-visibility.js
          node --check hockey-scheduler/e2e/factory-reset.js
          node --check hockey-scheduler/e2e/demo-lifecycle.js
          node --check hockey-scheduler/e2e/api-error-resilience.js
          node --check hockey-scheduler/e2e/v1-dependency-proof.js
          node --check hockey-scheduler/e2e/check-v1-route-contract.js
          node --check hockey-scheduler/e2e/team-club-optional.js
          node --check hockey-scheduler/e2e/division-delete-cleanup.js
          node --check hockey-scheduler/e2e/registration-cleanup.js
          node --check hockey-scheduler/e2e/venue-sharing.js
          node --check hockey-scheduler/e2e/records-delete.js
          node --check hockey-scheduler/e2e/coach-scope.js
          node --check hockey-scheduler/e2e/context-switcher.js
          node --check hockey-scheduler/e2e/player-edit.js
          node --check hockey-scheduler/e2e/player-lifecycle.js
          node --check hockey-scheduler/e2e/season-dates.js
          node --check hockey-scheduler/e2e/season-fmt-unit.js
          node --check hockey-scheduler/e2e/scheduling-policy.js
          node --check hockey-scheduler/e2e/accessibility-foundations.js
          node --check hockey-scheduler/e2e/home-tasks-hub.js
          node --check hockey-scheduler/e2e/role-home-journeys.js
          node --check hockey-scheduler/e2e/setup-progress-conflict-attention.js
      - name: Check v1 route contract (#233 B2c)
        run: node hockey-scheduler/e2e/check-v1-route-contract.js
      - name: Season date formatter unit regression (#272)
        run: node hockey-scheduler/e2e/season-fmt-unit.js

  browser-smoke:
    needs: changes
    if: needs.changes.outputs.browser_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hockey-scheduler/e2e
    strategy:
      fail-fast: false
      matrix:
        # Four isolated runners (#260 Slice F): each shard runs its own
        # journeys sequentially via one runner/server-per-journey lifecycle,
        # same as before — only the grouping into parallel jobs is new.
        # Journey pairs that hardcode the SAME desktop/phone ports
        # (season-rollover/permanent-teams: 8143/8144, demo-lifecycle/
        # team-club-optional: 8181/8182, allowed-venues/division-delete-
        # cleanup: 8191/8192) are deliberately split across different
        # shards so they never risk running concurrently on the same
        # runner.
        include:
          - shard: 1
            scripts: "smoke setup-claim onboarding-wizard hierarchy-import season-participation hierarchy-duplicate-registration season-rollover season-dates scheduling-policy"
          - shard: 2
            scripts: "team-division-participation scheduler-empty-state scheduler-already-scheduled allowed-venues venue-access-cleanup venue-sharing permanent-teams player-edit accessibility-foundations"
          - shard: 3
            scripts: "safe-destructive destructive-surfaces reset-visibility factory-reset demo-lifecycle api-error-resilience ice-availability-builder context-switcher role-home-journeys"
          - shard: 4
            scripts: "v1-dependency-proof team-club-optional division-delete-cleanup registration-cleanup records-delete coach-scope player-lifecycle home-tasks-hub setup-progress-conflict-attention"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Cache the Playwright browser bundle (~130 MB Chromium) keyed on the
      # pinned playwright version, so the four shards — and every later run on
      # the same version — restore it instead of each downloading Chromium from
      # scratch. The OS-level shared-library deps are cheap and are (re)applied
      # every run via `install-deps`, which is a no-op when already present.
      - name: Resolve Playwright version
        id: pw
        working-directory: hockey-scheduler/e2e
        run: |
          set -euo pipefail
          # Read the pinned version from the committed lockfile — node_modules
          # does not exist yet (npm ci runs after we restore the cache).
          VERSION="$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Playwright $VERSION"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install e2e dependencies
        run: npm ci
      - name: Install Chromium (cache miss only)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium OS deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run shard ${{ matrix.shard }} journeys
        run: |
          set -e
          for script in ${{ matrix.scripts }}; do
            echo "::group::npm run $script"
            npm run "$script"
            echo "::endgroup::"
          done
