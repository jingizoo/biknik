name: Hockey Scheduler Backend CI

on:
  pull_request:
    paths:
      - "hockey-scheduler/backend/**"
      - "hockey-scheduler/docs/**"
      - ".github/workflows/hockey-scheduler-ci.yml"
  push:
    branches:
      - main
    paths:
      - "hockey-scheduler/backend/**"
      - "hockey-scheduler/docs/**"
      - ".github/workflows/hockey-scheduler-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hockey-scheduler/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
