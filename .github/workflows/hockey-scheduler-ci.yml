name: Hockey Scheduler Backend CI

on:
  pull_request:
    paths:
      - "hockey-scheduler/backend/**"
      - "hockey-scheduler/docs/**"
      - "hockey-scheduler/e2e/**"
      - ".github/workflows/hockey-scheduler-ci.yml"
  push:
    branches:
      - main
    paths:
      - "hockey-scheduler/backend/**"
      - "hockey-scheduler/docs/**"
      - "hockey-scheduler/e2e/**"
      - ".github/workflows/hockey-scheduler-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hockey-scheduler/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests (in-memory + SQLite)
        run: python -m unittest discover -s tests -v

  postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hockey-scheduler/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hockey
          POSTGRES_PASSWORD: hockey
          POSTGRES_DB: hockey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hockey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Postgres driver
        run: pip install "psycopg[binary]>=3.1"
      - name: Run full suite against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://hockey:hockey@localhost:5432/hockey
        run: python -m unittest discover -s tests -v

  frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check browser scripts
        run: |
          node --check hockey-scheduler/backend/hockey_scheduler/web/static/app.js
          node --check hockey-scheduler/backend/hockey_scheduler/web/static/setup.js
          node --check hockey-scheduler/backend/hockey_scheduler/web/static/onboarding.js
          node --check hockey-scheduler/e2e/setup-claim.js
          node --check hockey-scheduler/e2e/onboarding-wizard.js

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hockey-scheduler/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright (#138)
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run existing application smoke
        run: npm run smoke
      - name: Run production first-admin claim journey
        run: npm run setup-claim
      - name: Initial Setup desktop automatic route
        env:
          ONBOARDING_VIEWPORT: desktop
          ONBOARDING_PHASE: route
        run: npm run onboarding-wizard
      - name: Initial Setup desktop rendered content
        env:
          ONBOARDING_VIEWPORT: desktop
          ONBOARDING_PHASE: content
        run: npm run onboarding-wizard
      - name: Initial Setup desktop persisted status
        env:
          ONBOARDING_VIEWPORT: desktop
          ONBOARDING_PHASE: landing
        run: npm run onboarding-wizard
      - name: Initial Setup desktop resume
        env:
          ONBOARDING_VIEWPORT: desktop
          ONBOARDING_PHASE: resume
        run: npm run onboarding-wizard
      - name: Initial Setup desktop drawer reuse
        env:
          ONBOARDING_VIEWPORT: desktop
          ONBOARDING_PHASE: full
        run: npm run onboarding-wizard
      - name: Initial Setup phone automatic route
        env:
          ONBOARDING_VIEWPORT: phone
          ONBOARDING_PHASE: route
        run: npm run onboarding-wizard
      - name: Initial Setup phone rendered content
        env:
          ONBOARDING_VIEWPORT: phone
          ONBOARDING_PHASE: content
        run: npm run onboarding-wizard
      - name: Initial Setup phone persisted status
        env:
          ONBOARDING_VIEWPORT: phone
          ONBOARDING_PHASE: landing
        run: npm run onboarding-wizard
      - name: Initial Setup phone resume
        env:
          ONBOARDING_VIEWPORT: phone
          ONBOARDING_PHASE: resume
        run: npm run onboarding-wizard
      - name: Initial Setup phone drawer reuse
        env:
          ONBOARDING_VIEWPORT: phone
          ONBOARDING_PHASE: full
        run: npm run onboarding-wizard
