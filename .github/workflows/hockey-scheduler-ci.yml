name: Hockey Scheduler Backend CI

on:
  pull_request:
    paths:
      - "hockey-scheduler/backend/**"
      - "hockey-scheduler/docs/**"
      - "hockey-scheduler/e2e/**"
      - ".github/workflows/hockey-scheduler-ci.yml"
  push:
    branches:
      - main
    paths:
      - "hockey-scheduler/backend/**"
      - "hockey-scheduler/docs/**"
      - "hockey-scheduler/e2e/**"
      - ".github/workflows/hockey-scheduler-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hockey-scheduler/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests (in-memory + SQLite)
        run: python -m unittest discover -s tests -v

  postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hockey-scheduler/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hockey
          POSTGRES_PASSWORD: hockey
          POSTGRES_DB: hockey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hockey"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Postgres driver
        run: pip install "psycopg[binary]>=3.1"
      - name: Run full suite against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://hockey:hockey@localhost:5432/hockey
        run: python -m unittest discover -s tests -v

  frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check browser scripts
        run: |
          node --check hockey-scheduler/backend/hockey_scheduler/web/static/app.js
          node --check hockey-scheduler/backend/hockey_scheduler/web/static/setup.js
          node --check hockey-scheduler/backend/hockey_scheduler/web/static/onboarding.js
          node --check hockey-scheduler/backend/hockey_scheduler/web/static/onboarding-bootstrap.js
          node --check hockey-scheduler/backend/hockey_scheduler/web/static/hierarchy-import.js
          node --check hockey-scheduler/e2e/setup-claim.js
          node --check hockey-scheduler/e2e/onboarding-wizard.js
          node --check hockey-scheduler/e2e/hierarchy-import.js
          node --check hockey-scheduler/e2e/season-participation.js
          node --check hockey-scheduler/e2e/season-rollover.js
          node --check hockey-scheduler/e2e/team-division-participation.js
          node --check hockey-scheduler/e2e/permanent-teams.js
          node --check hockey-scheduler/e2e/safe-destructive.js
          node --check hockey-scheduler/e2e/destructive-surfaces.js
          node --check hockey-scheduler/e2e/reset-visibility.js
          node --check hockey-scheduler/e2e/demo-lifecycle.js
          node --check hockey-scheduler/e2e/api-error-resilience.js
          node --check hockey-scheduler/e2e/v1-dependency-proof.js
          node --check hockey-scheduler/e2e/check-v1-route-contract.js
          node --check hockey-scheduler/e2e/team-club-optional.js
          node --check hockey-scheduler/e2e/division-delete-cleanup.js
          node --check hockey-scheduler/e2e/registration-cleanup.js
          node --check hockey-scheduler/e2e/venue-sharing.js
      - name: Check v1 route contract (#233 B2c)
        run: node hockey-scheduler/e2e/check-v1-route-contract.js

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hockey-scheduler/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright (#138)
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run existing application smoke
        run: npm run smoke
      - name: Run production first-admin claim journey
        run: npm run setup-claim
      - name: Run guided Initial Setup journey
        run: npm run onboarding-wizard
      - name: Run complete hierarchy import journey
        run: npm run hierarchy-import
      - name: Run season participation journey
        run: npm run season-participation
      - name: Run season rollover journey
        run: npm run season-rollover
      - name: Run team/division participation journey
        run: npm run team-division-participation
      - name: Run Allowed Venues journey
        run: npm run allowed-venues
      - name: Run venue-access cleanup journey
        run: npm run venue-access-cleanup
      - name: Run venue-sharing journey
        run: npm run venue-sharing
      - name: Run permanent-teams structure journey
        run: npm run permanent-teams
      - name: Run safe destructive actions journey
        run: npm run safe-destructive
      - name: Run destructive-action surfaces journey
        run: npm run destructive-surfaces
      - name: Run reset-demo visibility journey
        run: npm run reset-visibility
      - name: Run demo lifecycle journey
        run: npm run demo-lifecycle
      - name: Run API error-resilience journey
        run: npm run api-error-resilience
      - name: Run v1-dependency proof journey
        run: npm run v1-dependency-proof
      - name: Run club-optional Team lifecycle journey
        run: npm run team-club-optional
      - name: Run Division-deletion cleanup journey
        run: npm run division-delete-cleanup
      - name: Run inactive-registration cleanup journey
        run: npm run registration-cleanup
