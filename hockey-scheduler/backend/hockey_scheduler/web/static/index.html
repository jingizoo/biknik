<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hockey Scheduler — Operator Console</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/web.css" />
</head>
<body class="web-body">
  <div class="web">
    <!-- sidebar -->
    <aside class="sidebar">
      <div class="brand"><span class="brand-ico">🏒</span>
        <div><div class="brand-name">Hockey Scheduler</div>
          <div class="brand-sub">Operator Console</div></div></div>

      <nav class="side-nav">
        <button class="tab active" data-tab="dashboard"><span class="ti">📊</span>Dashboard</button>
        <button class="tab" data-tab="setup"><span class="ti">🧩</span>Setup</button>
        <button class="tab" data-tab="calendar"><span class="ti">📅</span>Arena Calendar</button>
        <button class="tab" data-tab="games"><span class="ti">📋</span>Games</button>
        <button class="tab" data-tab="roster"><span class="ti">🏒</span>Roster</button>
        <button class="tab" data-tab="activity"><span class="ti">🔔</span>Activity</button>
        <button class="tab" data-tab="public"><span class="ti">🌐</span>Public</button>
      </nav>

      <div class="side-foot">
        <button id="reset-btn" class="act ghost" title="Reset demo data">Reset demo</button>
        <a class="mobile-link" href="/mobile">📱 Mobile preview</a>
        <div class="side-note">Demo data · in-memory store</div>
      </div>
    </aside>

    <!-- main -->
    <main class="main">
      <header class="topbar">
        <div><h1 id="nav-title">Dashboard</h1>
          <div class="crumbs">Alpine Ice Hockey League · 2026–27 Winter Season</div></div>
        <div class="topbar-actions">
          <span class="env-pill">Demo</span>
        </div>
      </header>
      <div id="content" class="content"></div>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
