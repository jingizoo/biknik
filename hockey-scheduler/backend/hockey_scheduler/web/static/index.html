<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hockey Scheduler — Operator Console</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/web.css" />
</head>
<body class="web-body">
  <div class="web">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">H</span>
        <div><div class="brand-name">Hockey Scheduler</div>
          <div class="brand-sub">Operator Console</div></div>
      </div>

      <nav class="side-nav">
        <div class="nav-group">
          <div class="nav-group-label">Overview</div>
          <button class="tab active" data-tab="dashboard"><span class="nav-dot"></span><span class="nav-label">Dashboard</span></button>
          <button class="tab" data-tab="activity"><span class="nav-dot"></span><span class="nav-label">Activity</span></button>
        </div>
        <div class="nav-group">
          <div class="nav-group-label">Scheduling</div>
          <button class="tab" data-tab="calendar"><span class="nav-dot"></span><span class="nav-label">Arena Calendar</span></button>
          <button class="tab" data-tab="games"><span class="nav-dot"></span><span class="nav-label">Games</span></button>
          <button class="tab" data-tab="scheduler" style="display:none"><span class="nav-dot"></span><span class="nav-label">Scheduler</span></button>
          <button class="tab" data-tab="setup"><span class="nav-dot"></span><span class="nav-label">Setup</span></button>
          <button class="tab" data-tab="import" style="display:none"><span class="nav-dot"></span><span class="nav-label">Import</span></button>
        </div>
        <div class="nav-group">
          <div class="nav-group-label">People</div>
          <button class="tab" data-tab="player_home" style="display:none"><span class="nav-dot"></span><span class="nav-label">Home</span></button>
          <button class="tab" data-tab="guardian_home" style="display:none"><span class="nav-dot"></span><span class="nav-label">My Players</span></button>
          <button class="tab" data-tab="roster"><span class="nav-dot"></span><span class="nav-label">Roster</span></button>
          <button class="tab" data-tab="inbox" style="display:none"><span class="nav-dot"></span><span class="nav-label">My Assignments</span></button>
        </div>
        <div class="nav-group">
          <div class="nav-group-label">Competition</div>
          <button class="tab" data-tab="standings"><span class="nav-dot"></span><span class="nav-label">Standings</span></button>
          <button class="tab" data-tab="sheet"><span class="nav-dot"></span><span class="nav-label">Game Sheet</span></button>
        </div>
        <div class="nav-group">
          <div class="nav-group-label">Comms</div>
          <button class="tab" data-tab="notifications"><span class="nav-dot"></span><span class="nav-label">Notifications</span><span class="nav-badge" id="notif-badge" style="display:none"></span></button>
          <button class="tab" data-tab="delivery" style="display:none"><span class="nav-dot"></span><span class="nav-label">Delivery</span></button>
          <button class="tab" data-tab="public"><span class="nav-dot"></span><span class="nav-label">Public</span></button>
        </div>
        <div class="nav-group">
          <div class="nav-group-label">Admin</div>
          <button class="tab" data-tab="users" style="display:none"><span class="nav-dot"></span><span class="nav-label">Users</span></button>
          <button class="tab" data-tab="readiness" style="display:none"><span class="nav-dot"></span><span class="nav-label">Pilot Readiness</span></button>
        </div>
      </nav>

      <div class="side-foot">
        <label class="side-switch">
          <span class="side-switch-label">Signed in as</span>
          <select id="role-switch"></select>
        </label>
        <div class="side-user">
          <div class="side-user-av" id="user-avatar">–</div>
          <div class="side-user-meta">
            <div class="side-user-name" id="user-name">Signed out</div>
            <div class="side-user-role"><span id="user-role"></span><span class="scope-chip" id="scope-chip"></span></div>
          </div>
          <button id="signout-btn" class="side-signout" title="Sign out of this session" aria-label="Sign out">⏻</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <div class="topbar-heading">
            <h1 id="nav-title">Dashboard</h1>
            <span id="env-chips" class="env-chips"></span>
          </div>
          <div id="breadcrumb" class="crumbs"></div>
        </div>
        <div class="topbar-actions">
          <button class="act ghost" data-open-drawer="ice-slot">＋ Add Ice</button>
          <button class="act primary" data-goto="calendar">＋ Schedule Game</button>
          <button id="reset-btn" class="act ghost icon-only" title="Reset demo data" aria-label="Reset demo data">↺</button>
        </div>
      </header>
      <div id="content" class="content"></div>
    </main>
  </div>

  <!-- Action feedback (#118 Phase 5): a single fixed toast, always visible
       regardless of scroll position, instead of one rendered inline at the
       bottom of each view (which was below the fold on long pages). -->
  <div id="toast-root" class="toast-root" hidden></div>

  <!-- Sign-in screen (#71): shown when there is no session. In production the
       account picker is empty, so the manual form is the only way in. -->
  <div id="login-screen" class="login-screen" hidden>
    <div class="login-card">
      <div class="login-brand"><span class="brand-mark">H</span>
        <div><div class="brand-name">Hockey Scheduler</div>
          <div class="brand-sub">Operator Console</div></div></div>
      <h1 class="login-title">Sign in</h1>
      <form id="login-form" class="login-form" autocomplete="on">
        <label class="login-field"><span>Username</span>
          <input id="login-user" type="text" autocomplete="username" autocapitalize="none" required /></label>
        <label class="login-field"><span>Password</span>
          <input id="login-pass" type="password" autocomplete="current-password" required /></label>
        <div id="login-error" class="login-error" hidden></div>
        <button type="submit" class="act primary login-submit">Sign in</button>
      </form>
      <div id="login-personas" class="login-personas"></div>
      <button type="button" id="guest-public-link" class="act ghost login-guest-link">View public schedule &amp; standings</button>
    </div>
  </div>

  <!-- Public portal (#34): schedule + standings, reachable without signing
       in — no session, no staff nav, just the public-safe data the backend
       already serves at /api/public/*. Bookmarkable via #public. -->
  <div id="public-screen" class="public-screen" hidden>
    <div class="public-shell">
      <div class="public-topbar">
        <div class="login-brand"><span class="brand-mark">H</span>
          <div><div class="brand-name">Hockey Scheduler</div>
            <div class="brand-sub">Public Schedule</div></div></div>
        <button type="button" id="public-signin-link" class="act ghost">Staff sign in</button>
      </div>
      <div id="public-content"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
